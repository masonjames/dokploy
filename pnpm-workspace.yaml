packages:
  - "apps/api"
  - "apps/dokploy"
  - "apps/schedules"
  - "packages/server"

peerDependencyRules:
  ignoreMissing:
    - prisma
    - "@prisma/client"
    - "@prisma/engines"
    - "@electric-sql/pglite"
    - typescript
    - drizzle-kit

onlyBuiltDependencies:
  - "@scarf/scarf"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - bcrypt
  - better-sqlite3
  - core-js-pure
  - cpu-features
  - esbuild
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter
  - tree-sitter-json
