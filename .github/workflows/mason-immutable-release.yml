name: Mason immutable Dokploy release

on:
  pull_request:
    branches: [mj/prod-caddy]
  push:
    branches: [mj/prod-caddy]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mason-dokploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Mason Caddy release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.4.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Mason release contracts
        run: python3 scripts/test-mason-release.py

      - name: Run focused Caddy and release tests
        run: >-
          pnpm --filter ./apps/dokploy test --run
          __test__/caddy
          __test__/deploy/application.command.test.ts
          __test__/deploy/application-image-cas.test.ts
          __test__/deploy/build-admission.test.ts
          __test__/deploy/build-environment-argv.test.ts
          __test__/deploy/compose-build-admission.test.ts
          __test__/deploy/database-service-build-admission.test.ts
          __test__/deploy/exec-async-remote.test.ts
          __test__/deploy/forward-auth-build-admission.test.ts
          __test__/deploy/libsql-build-admission.test.ts
          __test__/deploy/provider-git-askpass.test.ts
          __test__/deploy/pull-image-build-admission.test.ts
          __test__/deploy/rollback-build-admission.test.ts
          __test__/deploy/settings-build-admission.test.ts
          __test__/deploy/service-start-build-admission.test.ts
          __test__/deploy/snapshot-service-start-build-admission.test.ts
          __test__/deploy/application-release-api.test.ts
          __test__/deploy/application-release-cloud-api.test.ts
          __test__/deploy/application-runtime-status.test.ts
          __test__/deploy/deployment-job-status.test.ts
          __test__/queues/in-memory-queue.test.ts

      - name: Typecheck Dokploy
        run: pnpm --filter ./apps/dokploy typecheck

      - name: Typecheck server package
        run: pnpm --filter=@dokploy/server typecheck

  build:
    name: Build, attest, and scan immutable image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.immutable.outputs.image }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify source revision
        env:
          CLAIMED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          [[ "$CLAIMED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$actual_sha" = "$CLAIMED_SHA" ]

      - name: Prepare production environment file
        run: |
          set -euo pipefail
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3.12.0

      - name: Prepare immutable image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v5.10.0
        with:
          images: ghcr.io/masonjames/dokploy
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build candidate for pre-publish scan
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/mason-dokploy:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/masonjames/dokploy
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inventory unresolved critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/mason-dokploy:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          output: trivy-image-unresolved.txt
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Enforce critical vulnerability threshold before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/mason-dokploy:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          output: trivy-image-gate.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/masonjames/dokploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Resolve immutable image reference
        id: immutable
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=ghcr.io/masonjames/dokploy@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/masonjames/dokploy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_IMAGE: ${{ steps.immutable.outputs.image }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMMUTABLE_IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --format json > provenance-verification.json
          jq -e 'length > 0' provenance-verification.json >/dev/null

      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mason-dokploy-release-${{ github.sha }}
          path: |
            provenance-verification.json
            trivy-image-gate.txt
            trivy-image-unresolved.txt
          if-no-files-found: warn
          retention-days: 90
